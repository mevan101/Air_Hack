<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Air Hackathon 2026 landing page.">
  <meta name="theme-color" content="#020810">
  <title>Air Hackathon 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #020810; }
    html.js-cursor { cursor: none; }

    body {
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #020810;
      font-family: 'Inter', sans-serif;
    }

    /* ══════════════════════════════════════════ CURSOR */
    #cur-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid rgba(148, 218, 255, 0.45);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      transition: width .35s ease, height .35s ease, border-color .3s ease;
    }
    #cur-dot {
      position: fixed;
      width: 4px; height: 4px;
      background: rgba(148, 218, 255, 0.95);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
    }

    /* ══════════════════════════════════════════ CANVAS */
    #c-stars, #c-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #c-stars     { z-index: 1; }
    #c-particles { z-index: 3; }

    /* ══════════════════════════════════════════ AURORA BLOBS */
    .glb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .glb1 {
      z-index: 2;
      width: 58vw; height: 42vh;
      background: radial-gradient(ellipse, rgba(22, 110, 205, 0.13) 0%, transparent 70%);
      top: -12vh; left: 14%;
      animation: glb-drift 16s ease-in-out infinite alternate;
    }
    .glb2 {
      z-index: 2;
      width: 42vw; height: 36vh;
      background: radial-gradient(ellipse, rgba(14, 165, 148, 0.09) 0%, transparent 70%);
      top: 4vh; right: 4%;
      animation: glb-drift 21s ease-in-out infinite alternate-reverse;
    }
    .glb3 {
      z-index: 2;
      width: 28vw; height: 24vh;
      background: radial-gradient(ellipse, rgba(88, 40, 168, 0.07) 0%, transparent 70%);
      top: 28vh; left: 2%;
      animation: glb-drift 26s ease-in-out infinite alternate;
    }
    @keyframes glb-drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(3vw, 2.5vh) scale(1.1); }
    }

    /* ══════════════════════════════════════════ HORIZON HAZE */
    #horizon {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 44vh;
      background: linear-gradient(to top,
        rgba(6, 14, 30, 0.95) 0%,
        rgba(6, 14, 30, 0.45) 38%,
        transparent 100%);
      z-index: 3;
      pointer-events: none;
    }

    /* ══════════════════════════════════════════ SCENE WRAPPER */
    #scene-wrap {
      position: fixed;
      bottom: 36px;
      left: 0; right: 0;
      height: 36vh;
      z-index: 4;
      pointer-events: none;
    }
    #scene-svg {
      width: 100%;
      height: 100%;
    }

    /* Wind turbine blades */
    .t-bl {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: t-spin 11s linear infinite;
    }
    .t-bl-b { animation-duration: 16s; animation-direction: reverse; }
    .t-bl-c { animation-duration: 8s; }
    @keyframes t-spin { to { transform: rotate(360deg); } }

    /* Tree sway */
    .tree { transform-box: fill-box; transform-origin: 50% 100%; }
    .sw-a { animation: swy 5.2s ease-in-out infinite alternate; }
    .sw-b { animation: swy 6.8s ease-in-out infinite alternate-reverse; }
    .sw-c { animation: swy 4.5s ease-in-out infinite alternate; }
    @keyframes swy {
      from { transform: rotate(-1.3deg); }
      to   { transform: rotate( 1.3deg); }
    }

    /* ══════════════════════════════════════════ TEXT STAGE */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      padding-bottom: 30vh;
      pointer-events: none;
      user-select: none;
    }

    .t-hack {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(3rem, 7.5vw, 8.8rem);
      letter-spacing: 0.10em;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 0 80px rgba(120, 210, 255, 0.10);
      line-height: 1;
      opacity: 0;
      animation: fd-up 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
    }

    .t-year {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.8rem, 4.5vw, 5rem);
      letter-spacing: 0.28em;
      color: rgba(120, 210, 255, 0.62);
      line-height: 1;
      margin-top: 0.14em;
      opacity: 0;
      animation: fd-up 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
    }

    .div-line {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 210, 255, 0.32), transparent);
      margin: 2.2em auto;
      opacity: 0;
      animation: fd-in 1.2s ease 1.7s forwards;
    }

    .t-soon {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: clamp(0.58rem, 0.85vw, 0.78rem);
      letter-spacing: 0.58em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.28);
      opacity: 0;
      animation: fd-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
    }

    @keyframes fd-up {
      from { opacity: 0; transform: translateY(16px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
    @keyframes fd-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ══════════════════════════════════════════ SENSOR BAR */
    #sbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 36px;
      z-index: 10;
      background: rgba(2, 7, 18, 0.90);
      border-top: 1px solid rgba(120, 200, 255, 0.07);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 0;
      overflow: hidden;
      opacity: 0;
      animation: fd-in 1s ease 3.1s forwards;
      backdrop-filter: blur(10px);
    }
    .si {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 15px;
      border-right: 1px solid rgba(255, 255, 255, 0.04);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .si:last-child { border-right: none; }
    .si-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .si-dot.g { background: #22c55e; animation: pdot 2.2s ease-in-out infinite; }
    .si-dot.y { background: #f59e0b; animation: pdot 2.8s ease-in-out infinite; }
    .si-dot.r { background: #ef4444; animation: pdot 1.6s ease-in-out infinite; }
    @keyframes pdot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.55); }
    }
    .si-lbl {
      font-size: 8.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(120, 200, 255, 0.38);
      font-weight: 300;
    }
    .si-val {
      font-size: 10px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.52);
      font-weight: 300;
    }

    /* ══════════════════════════════════════════ VIGNETTE */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 7;
      background: radial-gradient(ellipse 78% 68% at 50% 42%, transparent 38%, rgba(2, 8, 18, 0.52) 100%);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .t-hack, .t-year, .t-soon, .div-line, #sbar { opacity: 1 !important; filter: none !important; transform: none !important; }
    }
    @media (pointer: coarse), (hover: none) {
      #cur-ring, #cur-dot { display: none; }
      html.js-cursor { cursor: auto; }
    }
  </style>
</head>

<main id="stage" aria-label="Air Hackathon landing content">

<!-- ══ SENSOR BAR ══ -->
<div id="sbar">
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">AQI</span><span class="si-val" id="s-aqi">42</span></div>
  <div class="si"><div class="si-dot y"></div><span class="si-lbl">PM2.5</span><span class="si-val" id="s-pm">18.4 µg/m³</span></div>
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">CO₂</span><span class="si-val" id="s-co2">412 ppm</span></div>
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">NO₂</span><span class="si-val">0.04 ppm</span></div>
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">O₃</span><span class="si-val">0.03 ppm</span></div>
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">Temp</span><span class="si-val">28.5 °C</span></div>
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">Humidity</span><span class="si-val">72 %</span></div>
  <div class="si"><div class="si-dot g"></div><span class="si-lbl">Wind</span><span class="si-val">14 km/h NE</span></div>
</div>

<div id="vignette"></div>

<script>
// ══════════════════════════════════════════════════════ CURSOR
const cRing = document.getElementById('cur-ring');
const cDot  = document.getElementById('cur-dot');
let mx = innerWidth / 2, my = innerHeight / 2;
let rx = mx, ry = my;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const supportsFinePointer = window.matchMedia('(pointer: fine)').matches && window.matchMedia('(hover: hover)').matches;
const useCustomCursor = supportsFinePointer && !prefersReducedMotion;

if (useCustomCursor && cRing && cDot) {
  // Only hide native cursor once JS cursor is ready
  document.documentElement.classList.add('js-cursor');

  document.addEventListener('mousemove', e => {
    mx = e.clientX;
    my = e.clientY;
    cDot.style.left = mx + 'px';
    cDot.style.top  = my + 'px';
  });

  (function rafCursor() {
    rx += (mx - rx) * 0.1;
    ry += (my - ry) * 0.1;
    cRing.style.left = rx + 'px';
    cRing.style.top  = ry + 'px';
    requestAnimationFrame(rafCursor);
  }());
}

// ══════════════════════════════════════════════════════ STARS
const sc   = document.getElementById('c-stars');
const sctx = sc.getContext('2d');
let stars  = [];
const getRenderDpr = () => Math.max(1, Math.min(2, window.devicePixelRatio || 1));

function buildStars() {
  const dpr = getRenderDpr();
  sc.width  = Math.floor(innerWidth * dpr);
  sc.height = Math.floor(innerHeight * dpr);
  sc.style.width = `${innerWidth}px`;
  sc.style.height = `${innerHeight}px`;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.floor(sc.width * sc.height / 2600);
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight * 0.60,
    r: Math.random() * 1.1 + 0.15,
    a: Math.random() * 0.62 + 0.1,
    p: Math.random() * Math.PI * 2,
    s: Math.random() * 0.45 + 0.18
  }));
}

function rafStars(ts) {
  const t = ts * 0.001;
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = s.a * (0.68 + 0.32 * Math.sin(t * s.s + s.p));
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, 6.2832);
    sctx.fillStyle = `rgba(210,230,255,${a})`;
    sctx.fill();
  }
  requestAnimationFrame(rafStars);
}

buildStars();
requestAnimationFrame(rafStars);

let starResizeTimer;
addEventListener('resize', () => {
  clearTimeout(starResizeTimer);
  starResizeTimer = setTimeout(buildStars, 150);
});

// ══════════════════════════════════════════════════════ AIR PARTICLES
const pc   = document.getElementById('c-particles');
const pctx = pc.getContext('2d');
const PCNT = 200;
let parts  = [];

function buildParticles() {
  const dpr = getRenderDpr();
  pc.width  = Math.floor(innerWidth * dpr);
  pc.height = Math.floor(innerHeight * dpr);
  pc.style.width = `${innerWidth}px`;
  pc.style.height = `${innerHeight}px`;
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function mkPart(rand) {
  return {
    x:  Math.random() * innerWidth,
    y:  rand ? Math.random() * innerHeight : innerHeight + 6,
    r:  Math.random() * 1.4 + 0.2,
    vx: (Math.random() - 0.5) * 0.32,
    vy: -(Math.random() * 0.42 + 0.1),
    a:  Math.random() * 0.25 + 0.04,
    h:  [196, 200, 185, 208][Math.floor(Math.random() * 4)],
    ph: Math.random() * 1000
  };
}

function rafParticles() {
  pctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.x += p.vx + Math.sin(p.y * 0.011 + p.ph) * 0.11;
    p.y += p.vy;
    if (p.y < -8) { parts[i] = mkPart(false); continue; }
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, 6.2832);
    pctx.fillStyle = `hsla(${p.h},52%,86%,${p.a})`;
    pctx.fill();
  }
  requestAnimationFrame(rafParticles);
}

buildParticles();
parts = Array.from({ length: PCNT }, () => mkPart(true));
requestAnimationFrame(rafParticles);

let partResizeTimer;
addEventListener('resize', () => {
  clearTimeout(partResizeTimer);
  partResizeTimer = setTimeout(buildParticles, 150);
});

// ══════════════════════════════════════════════════════ SENSOR FLUCTUATION
const sDefs = [
  { id: 's-aqi', base: 42,   range: 6,   dec: 0, unit: ''        },
  { id: 's-pm',  base: 18.4, range: 2.5, dec: 1, unit: ' µg/m³' },
  { id: 's-co2', base: 412,  range: 4,   dec: 0, unit: ' ppm'   }
];
const sEls = sDefs
  .map(d => ({ ...d, el: document.getElementById(d.id) }))
  .filter(s => s.el);

if (sEls.length) {
  setInterval(() => {
    for (const s of sEls) {
      const v = s.base + (Math.random() - 0.5) * s.range;
      s.el.textContent = v.toFixed(s.dec) + s.unit;
    }
  }, 3500);
}
</script>
</body>
