<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <!-- ─── HTTPS ENFORCEMENT ──────────────────────────────────────────────────
       This script runs synchronously before anything else renders.
       It immediately redirects any plain-HTTP visitor to the HTTPS equivalent.
       This is a client-side safety net while GitHub Pages provisions its
       Let's Encrypt certificate. Once GitHub enables "Enforce HTTPS" in the
       repository Pages settings this redirect becomes redundant but harmless.  -->
  <script>
    if (location.protocol !== 'https:' &&
        location.hostname !== 'localhost' &&
        location.hostname !== '127.0.0.1') {
      location.replace('https:' + location.href.substring(location.protocol.length));
    }
  </script>
  <!-- Tells browsers to auto-upgrade any accidental HTTP sub-resource to HTTPS.
       connect-src whitelists the three free APIs this page fetches; script-src,
       style-src, img-src and font-src lock down every other external resource. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src https://github.com https://objects.githubusercontent.com https://camo.githubusercontent.com; connect-src https://api.open-meteo.com https://air-quality-api.open-meteo.com https://nominatim.openstreetmap.org; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">
  <!-- Twitter / X card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="Air Hackathon 2026">
  <meta name="twitter:description" content="Open-innovation challenge on air quality. Coming Soon.">
  <meta name="twitter:image"       content="https://airhackathon.com/og.png">
  <meta id="m-tc" name="theme-color" content="#c8e8f5">
  <title>Air Hackathon 2026</title>
  <link rel="canonical" href="https://airhackathon.com">
  <!-- Structured data: Event -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Event",
    "name": "Air Hackathon 2026",
    "description": "Open-innovation challenge on air quality",
    "url": "https://airhackathon.com",
    "eventStatus": "https://schema.org/EventScheduled",
    "location": {
      "@type": "Place",
      "name": "Dhaka, Bangladesh",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Dhaka",
        "addressCountry": "BD"
      }
    },
    "organizer": {
      "@type": "Organization",
      "name": "Cedar Initiative",
      "url": "https://airhackathon.com"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════════════ THEME VARIABLES */
    :root {
      --bg:          #c8e8f5;
      --sky-t:       #5baed6;
      --sky-b:       #c8e8f5;
      --hz1:         rgba(175,218,238,0.92);
      --hz2:         rgba(175,218,238,0.40);
      --text-main:   rgba(4,22,62,0.94);
      --text-accent: rgba(8,52,148,0.80);
      --text-sub:    rgba(8,44,108,0.65);
      --divline:     rgba(8,52,128,0.28);
      --sbar-bg:     rgba(218,240,252,0.94);
      --sbar-bdr:    rgba(8,60,138,0.10);
      --sbar-lbl:    rgba(8,58,132,0.60);
      --sbar-val:    rgba(4,18,56,0.80);
      --vig:         rgba(188,224,244,0.35);
      --cur-ring:    rgba(8,72,156,0.40);
      --cur-dot:     rgba(8,72,156,0.90);
      --glb1:        rgba(75,158,218,0.18);
      --glb2:        rgba(55,188,168,0.10);
      --glb3:        rgba(115,78,198,0.08);
      --blend:       multiply;
      --star-vis:    0;
    }
    [data-theme="dark"] {
      --bg:          #020810;
      --sky-t:       #050c1e;
      --sky-b:       #152a48;
      --hz1:         rgba(8,18,42,0.97);
      --hz2:         rgba(10,22,48,0.50);
      --text-main:   rgba(255,255,255,0.96);
      --text-accent: rgba(140,220,255,0.78);
      --text-sub:    rgba(180,220,255,0.58);
      --divline:     rgba(120,210,255,0.38);
      --sbar-bg:     rgba(2,7,18,0.90);
      --sbar-bdr:    rgba(120,200,255,0.07);
      --sbar-lbl:    rgba(140,210,255,0.68);
      --sbar-val:    rgba(255,255,255,0.88);
      --vig:         rgba(2,8,18,0.52);
      --cur-ring:    rgba(148,218,255,0.45);
      --cur-dot:     rgba(148,218,255,0.95);
      --glb1:        rgba(30,120,240,0.38);
      --glb2:        rgba(14,200,165,0.28);
      --glb3:        rgba(110,50,220,0.22);
      --blend:       screen;
      --star-vis:    1;
    }

    html {
      background: var(--bg);
      transition: background 1.8s;
    }
    html.js-cursor { cursor: none; }

    body {
      width: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--sky-t) 0%, var(--sky-b) 100%);
      font-family: 'Inter', sans-serif;
      transition: background 1.8s;
    }

    /* ══════════════════════════════════════════ CURSOR */
    #cur-ring {
      position: fixed;
      width: 36px; height: 36px;
      border: 1px solid var(--cur-ring);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: var(--blend);
      transition: width .35s ease, height .35s ease, border-color .3s ease;
    }
    #cur-dot {
      position: fixed;
      width: 4px; height: 4px;
      background: var(--cur-dot);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: var(--blend);
    }

    /* ══════════════════════════════════════════ CANVAS */
    #c-stars, #c-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    #c-stars {
      z-index: 1;
      opacity: var(--star-vis);
      transition: opacity 0.5s;
    }
    #c-particles { z-index: 3; }

    /* ══════════════════════════════════════════ AURORA BLOBS */
    .glb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      mix-blend-mode: var(--blend);
    }
    .glb1 {
      z-index: 2;
      width: 58vw; height: 42vh;
      background: radial-gradient(ellipse, var(--glb1) 0%, transparent 70%);
      top: -12vh; left: 14%;
      animation: glb-drift 16s ease-in-out infinite alternate;
    }
    .glb2 {
      z-index: 2;
      width: 42vw; height: 36vh;
      background: radial-gradient(ellipse, var(--glb2) 0%, transparent 70%);
      top: 4vh; right: 4%;
      animation: glb-drift 21s ease-in-out infinite alternate-reverse;
    }
    .glb3 {
      z-index: 2;
      width: 28vw; height: 24vh;
      background: radial-gradient(ellipse, var(--glb3) 0%, transparent 70%);
      top: 28vh; left: 2%;
      animation: glb-drift 26s ease-in-out infinite alternate;
    }
    @keyframes glb-drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(3vw, 2.5vh) scale(1.1); }
    }

    /* ══════════════════════════════════════════ HORIZON HAZE */
    #horizon {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 44vh;
      background: linear-gradient(to top, var(--hz1) 0%, var(--hz2) 38%, transparent 100%);
      z-index: 3;
      pointer-events: none;
      transition: background 0.5s;
    }

    /* ══════════════════════════════════════════ SCENE WRAPPER */
    #scene-wrap {
      position: fixed;
      bottom: 36px;
      left: 0; right: 0;
      /* max() ensures the scene fills the full viewport width at any aspect ratio.
         1440/280 ≈ 5.143 is the SVG's native aspect ratio. */
      height: max(36vh, calc(100vw / 5.143));
      z-index: 4;
      pointer-events: none;
    }
    #scene-svg {
      width: 100%;
      height: 100%;
    }

    /* Wind turbine blades — transform-origin set per-element via style attr */
    .t-bl {
      animation: t-spin 11s linear infinite;
    }
    .t-bl-b { animation-duration: 16s; animation-direction: reverse; }
    .t-bl-c { animation-duration: 8s; }
    @keyframes t-spin { to { transform: rotate(360deg); } }

    /* Flag wave – hanging banner pivots at its top edge */
    .flag-cloth {
      transform-box: fill-box;
      transform-origin: 50% 0%;
      animation: flag-wave 3.4s ease-in-out infinite;
    }
    @keyframes flag-wave {
      0%   { transform: skewX(-3.5deg) scaleX(0.98); }
      33%  { transform: skewX(1.5deg)  scaleX(1.01); }
      66%  { transform: skewX(4deg)    scaleX(1.02); }
      100% { transform: skewX(-3.5deg) scaleX(0.98); }
    }

    /* ══════════════════════════════════════════ SCENE THEME CLASSES */
    /* Hills */
    .sc-hills { fill: #386832; }
    [data-theme="dark"] .sc-hills { fill: #0e2240; }

    /* Buildings */
    .sc-bld { fill: #3d4d5e; }
    [data-theme="dark"] .sc-bld { fill: #070e1d; }
    .sc-bld-detail { fill: #2e3d4e; }
    [data-theme="dark"] .sc-bld-detail { fill: #050b16; }

    /* Building windows */
    .sc-win { fill: rgba(200,225,255,0.25); }
    [data-theme="dark"] .sc-win { fill: rgba(255,240,160,0.88); }

    /* Ground / grass strip */
    .sc-gnd { fill: #3e6030; }
    [data-theme="dark"] .sc-gnd { fill: #060c1a; }

    /* Road surface */
    .sc-rd { fill: #505a68; }
    [data-theme="dark"] .sc-rd { fill: #07101c; }

    /* Road dashes */
    .sc-rd-dashes rect { fill: rgba(240,240,240,0.65); }
    [data-theme="dark"] .sc-rd-dashes rect { fill: rgba(100,180,255,0.09); }

    /* Lamppost pole / arm */
    .sc-lamp-pole { stroke: #2a3a50; }
    [data-theme="dark"] .sc-lamp-pole { stroke: #0e1d32; }

    /* Lamppost bulb */
    .sc-lamp-bulb { fill: rgba(200,180,140,0.5); }
    [data-theme="dark"] .sc-lamp-bulb { fill: rgba(255,230,110,1.0); }

    /* Lamppost halo glow (only visible in dark mode) */
    .sc-lamp-glow { fill: rgba(255,230,100,0); }
    [data-theme="dark"] .sc-lamp-glow { fill: rgba(255,225,80,0.30); }

    /* Vehicle headlights / taillights */
    .sc-headlight { fill: rgba(255,235,160,0.18); }
    [data-theme="dark"] .sc-headlight { fill: rgba(255,245,180,1.0); }
    .sc-taillight { fill: rgba(220,60,60,0.18); }
    [data-theme="dark"] .sc-taillight { fill: rgba(255,50,50,0.90); }

    /* Tree sway */
    .tree { transform-box: fill-box; transform-origin: 50% 100%; }
    .sw-a { animation: swy 5.2s ease-in-out infinite alternate; }
    .sw-b { animation: swy 6.8s ease-in-out infinite alternate-reverse; }
    .sw-c { animation: swy 4.5s ease-in-out infinite alternate; }
    @keyframes swy {
      from { transform: rotate(-1.3deg); }
      to   { transform: rotate( 1.3deg); }
    }

    /* ══════════════════════════════════════════ TEXT STAGE */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 6;
      padding: 0 20px 28vh;
      pointer-events: none;
      text-align: center;
    }

    .t-hack {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(3rem, 7.5vw, 8.8rem);
      letter-spacing: 0.10em;
      color: var(--text-main);
      text-shadow: 0 2px 40px rgba(0,0,0,0.08);
      line-height: 1;
      opacity: 0;
      animation: fd-up 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
      transition: color 0.5s;
    }

    .t-year {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.8rem, 4.5vw, 5rem);
      letter-spacing: 0.28em;
      color: var(--text-accent);
      line-height: 1;
      margin-top: 0.14em;
      opacity: 0;
      animation: fd-up 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.95s forwards;
      transition: color 0.5s;
    }

    .div-line {
      width: 64px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--divline), transparent);
      margin: 2.2em auto;
      opacity: 0;
      animation: fd-in 1.2s ease 1.7s forwards;
    }

    .t-soon {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(0.92rem, 1.35vw, 1.28rem);
      letter-spacing: 0.44em;
      text-transform: uppercase;
      color: var(--text-sub);
      opacity: 0;
      animation: fd-up 1.2s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;
      transition: color 0.5s;
    }

    @keyframes fd-up {
      from { opacity: 0; transform: translateY(16px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }
    .t-tag {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(0.62rem, 0.88vw, 0.80rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-sub);
      margin-top: 1.8em;
      opacity: 0;
      animation: fd-up 1.1s cubic-bezier(0.16, 1, 0.3, 1) 2.9s forwards;
      transition: color 0.5s;
    }
    @keyframes fd-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ══════════════════════════════════════════ SENSOR BAR */
    #sbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 36px;
      z-index: 10;
      background: var(--sbar-bg);
      border-top: 1px solid var(--sbar-bdr);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 0;
      overflow: hidden;
      opacity: 0;
      animation: fd-in 1s ease 3.1s forwards;
      backdrop-filter: blur(10px);
      transition: background 0.5s, border-color 0.5s;
    }
    .si {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 15px;
      border-right: 1px solid rgba(128,128,128,0.08);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .si:last-child { border-right: none; }
    .si-loc { gap: 8px; }
    .si-city {
      font-size: 8px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 400;
      color: rgba(34,197,94,0.90);
    }
    .si-updated {
      font-size: 7.5px;
      letter-spacing: 0.06em;
      color: var(--sbar-lbl);
      opacity: 0.70;
    }
    .si-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .si-dot.g { background: #22c55e; animation: pdot 2.2s ease-in-out infinite; }
    .si-dot.y { background: #f59e0b; animation: pdot 2.8s ease-in-out infinite; }
    .si-dot.o { background: #f97316; animation: pdot 2.0s ease-in-out infinite; }
    .si-dot.r { background: #ef4444; animation: pdot 1.6s ease-in-out infinite; }
    .si-dot.p { background: #9333ea; animation: pdot 1.4s ease-in-out infinite; }
    .si-dot.m { background: #9f1239; animation: pdot 1.2s ease-in-out infinite; }
    @keyframes pdot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.55); }
    }
    .si-lbl {
      font-size: 8.5px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--sbar-lbl);
      font-weight: 300;
      transition: color 0.5s;
    }
    .si-val {
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--sbar-val);
      font-weight: 300;
      transition: color 0.5s;
    }

    /* ══════════════════════════════════════════ VIGNETTE */
    #vignette {
      position: fixed;
      inset: 0;
      z-index: 7;
      background: radial-gradient(ellipse 78% 68% at 50% 42%, transparent 38%, var(--vig) 100%);
      pointer-events: none;
      transition: background 0.5s;
    }

    /* ══════════════════════════════════════════ THEME TOGGLE */
    /* theme-toggle button hidden in favour of the sun/moon SVG click targets */
    #theme-toggle { display: none; }
    .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun  { display: none; }
    [data-theme="dark"] .icon-moon { display: block; }

    /* ══════════════════════════════════════════ AIRSHIP */
    #airship-wrap {
      position: fixed;
      top: 0; left: 0;
      z-index: 8;
      pointer-events: none;
      will-change: transform;
      transform: translate(-400px, 20vh);
    }
    #airship-svg {
      width: 110px;
      height: auto;
      filter: drop-shadow(0 6px 16px rgba(0,20,60,0.20));
      overflow: visible;
    }
    .airship-prop {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: prop-spin 0.32s linear infinite;
    }
    @keyframes prop-spin { to { transform: rotate(360deg); } }


    /* ══════════════════════════════════════════ SUN & MOON */
    #sun-wrap {
      position: fixed;
      top: 7vh; right: 11vw;
      width: 78px; height: 78px;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.8s;
    }
    [data-theme="dark"] #sun-wrap { opacity: 0; }

    /* Radial conic "corona spokes" ring, rotates slowly */
    #sun-rays {
      position: absolute;
      inset: -48px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, 
        rgba(255,220,80,0.22) 0%, 
        rgba(255,180,40,0.14) 40%,
        rgba(255,140,10,0.06) 65%,
        transparent 80%);
      animation: sun-breathe 9s ease-in-out infinite;
    }
    /* Wide outer glow */
    #sun-glow {
      position: absolute;
      inset: -32px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,190,40,0.24) 0%, rgba(255,150,10,0.12) 50%, transparent 75%);
      animation: sun-breathe 7s ease-in-out infinite;
    }
    /* Hot disc */
    #sun-disc {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 38%, #fff9e8 0%, #ffe566 40%, #ffb300 72%, rgba(255,120,0,0) 100%);
      box-shadow: 0 0 18px 8px rgba(255,200,60,0.70), 0 0 50px 20px rgba(255,160,20,0.35);
      animation: sun-breathe 7s ease-in-out infinite 0.5s;
    }
    @keyframes sun-breathe {
      0%,100% { transform: scale(1.00); opacity: 1.0; }
      50%      { transform: scale(1.07); opacity: 0.94; }
    }
    @keyframes sun-rotate { to { transform: rotate(360deg); } }
    #sun-halo {
      position: absolute;
      inset: -80px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%,
        rgba(255,180,50,0.12) 0%,
        rgba(255,140,20,0.06) 50%,
        transparent 75%);
      opacity: 0.12;
      animation: sun-breathe-slow 14s ease-in-out infinite;
    }
    @keyframes sun-breathe-slow {
      0%,100% { transform: scale(1.00); opacity: 0.12; }
      50%      { transform: scale(1.10); opacity: 0.18; }
    }

    /* Moon */
    #moon-wrap {
      position: fixed;
      top: 7vh; right: 11vw;
      width: 70px; height: 70px;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s;
    }
    [data-theme="dark"] #moon-wrap { opacity: 1; }
    #moon-wrap svg { width: 100%; height: 100%; overflow: visible; }
    /* Sun/moon clickable theme toggle */
    #sun-wrap, #moon-wrap { pointer-events: auto; cursor: pointer; }
    #sun-wrap:hover, #moon-wrap:hover { transform: scale(1.1); transition: transform 0.25s; }

    /* ══════════════════════════════════════════ REDUCED MOTION */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .t-hack, .t-year, .t-soon, .t-tag, .div-line, #sbar, #sbar-wrap {
        opacity: 1 !important; filter: none !important; transform: none !important;
      }
    }
    @media (pointer: coarse), (hover: none) {
      #cur-ring, #cur-dot { display: none; }
      html.js-cursor { cursor: auto; }
    }

    /* ══════════════════════════════════════════ RESPONSIVE */
    /* Tablet and large phone (≤ 767px) */
    @media (max-width: 767px) {
      /* Sensor bar: scrollable row instead of clipped overflow */
      #sbar {
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding: 0 10px;
      }
      #sbar::-webkit-scrollbar { display: none; }
      .si { padding: 0 10px; }

      /* Scale airship down to fit smaller viewports */
      #airship-svg { width: 90px; }

      /* Reduce heavy CSS blur on mobile GPU */
      .glb { filter: blur(60px); }

      /* Tighter scene on mobile – keep it from eating too much vertical space */
      #scene-wrap { height: max(28vh, calc(100vw / 5.143)); }
      #stage { padding-bottom: 24vh; }
    }

    /* Small phone (≤ 479px) */
    @media (max-width: 479px) {
      #airship-svg { width: 72px; }
      .glb { filter: blur(36px); }

      /* Tighten letter-spacing so title fits without wrapping */
      .t-hack { letter-spacing: 0.06em; }
      .t-year { letter-spacing: 0.18em; }

      /* Give text stage horizontal breathing room */
      #stage { padding-left: 16px; padding-right: 16px; padding-bottom: 22vh; }

      /* Reduce scene height on very small screens */
      #scene-wrap { height: max(22vh, calc(100vw / 5.143)); }
    }

    /* Landscape orientation on short screens */
    @media (max-height: 480px) and (orientation: landscape) {
      #stage { padding-bottom: 16vh; }
      .div-line { margin: 1.2em auto; }
      #scene-wrap { height: max(28vh, calc(100vw / 5.143)); bottom: 36px; }
    }

    body.sky-sunrise { background: linear-gradient(to bottom, #ff9060 0%, #ffcc80 100%) !important; transition: background 0.6s !important; }
    body.sky-sunset  { background: linear-gradient(to bottom, #e06030 0%, #ff9040 100%) !important; transition: background 0.6s !important; }

    /* Medium screens – tablets / small laptops (768-1199px) */
    @media (min-width: 768px) and (max-width: 1199px) {
      #scene-wrap { height: max(32vh, calc(100vw / 5.143)); }
      #stage { padding-bottom: 26vh; }
    }

    /* Very large / wide screens (≥ 1600px) */
    @media (min-width: 1600px) {
      #scene-wrap { height: max(32vh, calc(100vw / 5.143)); bottom: 36px; }
      #stage { padding-bottom: 26vh; }
      /* Centre sensor bar items on wide displays */
      #sbar { justify-content: center; padding: 0 24px; }
    }
    /* Ultra-wide screens (≥ 2200px) */
    @media (min-width: 2200px) {
      #stage { padding-bottom: 24vh; }
      .t-hack { font-size: clamp(3rem, 5.5vw, 9.5rem); }
    }
    /* Tall screens (portrait big monitor) */
    @media (min-height: 1000px) {
      #stage { padding-bottom: 30vh; }
    }

    /* ══════════════════════════════════════════ FLAG PHYSICS */
    #flag-dir {
      /* CSS-transition for smooth swing when direction changes */
      transition: transform 0.55s ease;
      transform-box: fill-box;
      transform-origin: 50% 0%;   /* pivot at top-centre – where the banner bar is */
    }

    /* ══════════════════════════════════════════ CAR EXHAUST SMOKE */
    .car-exhaust {
      transform-box: fill-box;
      transform-origin: 50% 100%;
    }


    /* ══════════════════════════════════════════ SCREEN-READER ONLY */
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* ══════════════════════════════════════════ SCENE — LIGHT MODE OVERRIDES */
    /* Wind turbine elements */
    .sc-turb-tower   { fill: #07101e; }
    .sc-turb-nacelle { fill: #0b1c32; }
    .sc-turb-blade   { fill: #0d2040; }
    .sc-turb-hub     { fill: #091827; }
    :root .sc-turb-tower   { fill: #607d96; }
    :root .sc-turb-nacelle { fill: #4e6880; }
    :root .sc-turb-blade   { fill: #6e8fa8; }
    :root .sc-turb-hub     { fill: #405f75; }
    [data-theme="dark"] .sc-turb-tower   { fill: #07101e; }
    [data-theme="dark"] .sc-turb-nacelle { fill: #0b1c32; }
    [data-theme="dark"] .sc-turb-blade   { fill: #0d2040; }
    [data-theme="dark"] .sc-turb-hub     { fill: #091827; }

    /* Vehicle elements */
    .sc-veh-body  { fill: #09192c; }
    .sc-veh-cab   { fill: #0a1e35; }
    .sc-veh-wheel { fill: #040a14; }
    :root .sc-veh-body  { fill: #3e5268; }
    :root .sc-veh-cab   { fill: #4a6070; }
    :root .sc-veh-wheel { fill: #1e2d3a; }
    [data-theme="dark"] .sc-veh-body  { fill: #09192c; }
    [data-theme="dark"] .sc-veh-cab   { fill: #0a1e35; }
    [data-theme="dark"] .sc-veh-wheel { fill: #040a14; }

    /* Vehicle headlight beam cones */
    .sc-veh-beam   { fill: rgba(255,240,180,0); }
    [data-theme="dark"] .sc-veh-beam   { fill: rgba(255,240,180,0.10); }
    .sc-veh-beam-r { fill: rgba(255,80,60,0); }
    [data-theme="dark"] .sc-veh-beam-r { fill: rgba(255,80,60,0.07); }

    /* Plane elements */
    .sc-plane-body { fill: #0e2245; }
    :root .sc-plane-body  { fill: #7a92b0; }
    [data-theme="dark"] .sc-plane-body { fill: #0e2245; }
    .sc-plane-wing { fill: #0d1f40; }
    :root .sc-plane-wing { fill: #6a80a0; }
    [data-theme="dark"] .sc-plane-wing { fill: #0d1f40; }
    .sc-plane-eng  { fill: #0b1a35; }
    :root .sc-plane-eng  { fill: #556a84; }
    [data-theme="dark"] .sc-plane-eng  { fill: #0b1a35; }
    .sc-plane-fin  { fill: #0f2348; }
    :root .sc-plane-fin  { fill: #7a92b0; }
    [data-theme="dark"] .sc-plane-fin  { fill: #0f2348; }

    /* Hill layers */
    .sc-hills-far { fill: #5a9070; }
    [data-theme="dark"] .sc-hills-far { fill: #0a1a2e; }
    /* Mountain trees */
    .sc-mtn-pine  { fill: #1a3a1e; }
    [data-theme="dark"] .sc-mtn-pine { fill: #1a3520; }
    .sc-mtn-broad { fill: #235226; }
    [data-theme="dark"] .sc-mtn-broad { fill: #1e3820; }
    /* Stone hut walls */
    .sc-stone-hut { fill: #6a6455; }
    [data-theme="dark"] .sc-stone-hut { fill: #282420; }
    /* Alpine refuge red */
    .sc-refuge     { fill: #7a2215; }
    [data-theme="dark"] .sc-refuge { fill: #3a1008; }
    /* Mountain hut parts */
    .sc-hut-wall { fill: #5c3a1c; }
    [data-theme="dark"] .sc-hut-wall { fill: #1a1008; }
    .sc-hut-roof { fill: #8a5530; }
    [data-theme="dark"] .sc-hut-roof { fill: #2a1a0e; }
    .sc-hut-log  { fill: #4a3520; }
    [data-theme="dark"] .sc-hut-log  { fill: #160e05; }
    /* Snow cap: bright in light, muted in dark */
    .sc-snow       { fill: rgba(255,255,255,0.78); }
    [data-theme="dark"] .sc-snow { fill: rgba(200,215,230,0.25); }
    .sc-snow-hi    { fill: rgba(255,255,255,0.88); }
    [data-theme="dark"] .sc-snow-hi { fill: rgba(200,215,230,0.18); }
    /* Street shops */
    .sc-shop      { fill: #374c60; }
    [data-theme="dark"] .sc-shop { fill: #080f1d; }
    .sc-shop-awn  { fill: rgba(160,210,250,0.55); }
    [data-theme="dark"] .sc-shop-awn { fill: rgba(50,110,200,0.60); }
    /* Curtain wall glass strip */
    .sc-cwall     { fill: rgba(190,220,255,0.14); }
    [data-theme="dark"] .sc-cwall { fill: rgba(70,150,255,0.10); }
    /* Person silhouette */
    .sc-person    { fill: #2a3a4e; }
    [data-theme="dark"] .sc-person { fill: #080e1a; }

    /* ══════════════════════════════════════════ MOBILE SCROLL HINT */
    /* Fade-out gradient on the right edge of the sensor bar on mobile */
    @media (max-width: 767px) {
      #sbar-wrap {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 10;
        opacity: 0;
        animation: fd-in 1s ease 3.1s forwards;
      }
      #sbar {
        position: static;
        opacity: 1;
        animation: none;
      }
      #sbar-wrap::after {
        content: '';
        position: absolute;
        right: 0; top: 0; bottom: 0;
        width: 48px;
        background: linear-gradient(to left, var(--sbar-bg), transparent);
        pointer-events: none;
      }
    }
    /* Sky planes animation */
    @keyframes sky-fly-r  { from{transform:translate(-250px,18vh)} to{transform:translate(calc(100vw + 250px),18vh)} }
    @keyframes sky-fly-r2 { from{transform:translate(-220px,28vh)} to{transform:translate(calc(100vw + 220px),28vh)} }
    @keyframes sky-fly-l  { from{transform:translate(calc(100vw + 200px),8vh)} to{transform:translate(-200px,8vh)} }
  </style>
</head>

<div id="vignette"></div>

<script>
// ══════════════════════════════════════════════════════ THEME
(function () {
  var html  = document.documentElement;
  var btn   = document.getElementById('theme-toggle');
  var metaTC = document.getElementById('m-tc');

  // Apply saved preference (default is light)
  var saved = localStorage.getItem('airhack-theme');
  // Auto-detect theme from time of day if no saved preference
  if (!saved) {
    var hour = new Date().getHours();
    saved = (hour >= 19 || hour < 6) ? 'dark' : 'light';
  }
  if (saved === 'dark') {
    html.dataset.theme = 'dark';
    if (metaTC) metaTC.content = '#020810';
  }

  // Sun/moon click toggles theme
  var sunWrap  = document.getElementById('sun-wrap');
  var moonWrap = document.getElementById('moon-wrap');
  function doToggle() {
    var isDark = html.dataset.theme === 'dark';
    var goingDark = !isDark;
    var body = document.body;
    if (goingDark) {
      body.classList.add('sky-sunset');
      setTimeout(function() {
        body.classList.remove('sky-sunset');
        html.dataset.theme = 'dark';
        localStorage.setItem('airhack-theme', 'dark');
        if (metaTC) metaTC.content = '#020810';
        parts = Array.from({ length: PCNT }, function () { return mkPart(true); });
      }, 600);
    } else {
      body.classList.add('sky-sunrise');
      setTimeout(function() {
        body.classList.remove('sky-sunrise');
        html.dataset.theme = 'light';
        localStorage.setItem('airhack-theme', 'light');
        if (metaTC) metaTC.content = '#c8e8f5';
        parts = Array.from({ length: PCNT }, function () { return mkPart(true); });
      }, 600);
    }
  }
  if (sunWrap)  sunWrap.addEventListener('click',  doToggle);
  if (moonWrap) moonWrap.addEventListener('click', doToggle);
  if (btn) {
    btn.addEventListener('click', doToggle);
  }
}());

// ══════════════════════════════════════════════════════ CURSOR
const cRing = document.getElementById('cur-ring');
const cDot  = document.getElementById('cur-dot');
let mx = innerWidth / 2, my = innerHeight / 2;
let rx = mx, ry = my;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const supportsFinePointer  = window.matchMedia('(pointer: fine)').matches && window.matchMedia('(hover: hover)').matches;
const useCustomCursor = supportsFinePointer && !prefersReducedMotion;

if (useCustomCursor && cRing && cDot) {
  document.documentElement.classList.add('js-cursor');
  document.addEventListener('mousemove', function (e) {
    mx = e.clientX; my = e.clientY;
    cDot.style.left = mx + 'px';
    cDot.style.top  = my + 'px';
  });
  (function rafCursor() {
    rx += (mx - rx) * 0.1;
    ry += (my - ry) * 0.1;
    cRing.style.left = rx + 'px';
    cRing.style.top  = ry + 'px';
    requestAnimationFrame(rafCursor);
  }());
}

// ══════════════════════════════════════════════════════ STARS
const sc   = document.getElementById('c-stars');
const sctx = sc.getContext('2d');
let stars  = [];
const getRenderDpr = () => Math.max(1, Math.min(2, window.devicePixelRatio || 1));

function buildStars() {
  const dpr = getRenderDpr();
  sc.width  = Math.floor(innerWidth  * dpr);
  sc.height = Math.floor(innerHeight * dpr);
  sc.style.width  = innerWidth  + 'px';
  sc.style.height = innerHeight + 'px';
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.floor(sc.width * sc.height / 2600);
  stars = Array.from({ length: n }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight * 0.60,
    r: Math.random() * 1.1 + 0.15,
    a: Math.random() * 0.62 + 0.1,
    p: Math.random() * Math.PI * 2,
    s: Math.random() * 0.45 + 0.18
  }));
}

function rafStars(ts) {
  const t = ts * 0.001;
  sctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = s.a * (0.68 + 0.32 * Math.sin(t * s.s + s.p));
    sctx.beginPath();
    sctx.arc(s.x, s.y, s.r, 0, 6.2832);
    sctx.fillStyle = 'rgba(210,230,255,' + a + ')';
    sctx.fill();
  }
  requestAnimationFrame(rafStars);
}

buildStars();
requestAnimationFrame(rafStars);

let starResizeTimer;
addEventListener('resize', () => {
  clearTimeout(starResizeTimer);
  starResizeTimer = setTimeout(buildStars, 150);
});

// ══════════════════════════════════════════════════════ AIR PARTICLES
const pc   = document.getElementById('c-particles');
const pctx = pc.getContext('2d');
const PCNT = window.innerWidth < 768 ? 80 : 200;
let parts  = [];

function buildParticles() {
  const dpr = getRenderDpr();
  pc.width  = Math.floor(innerWidth  * dpr);
  pc.height = Math.floor(innerHeight * dpr);
  pc.style.width  = innerWidth  + 'px';
  pc.style.height = innerHeight + 'px';
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function mkPart(rand) {
  const dark  = document.documentElement.dataset.theme === 'dark';
  const hues  = dark ? [196, 200, 185, 208] : [38, 46, 52, 200];
  const alpha = dark ? Math.random() * 0.25 + 0.04 : Math.random() * 0.20 + 0.06;
  return {
    x:  Math.random() * innerWidth,
    y:  rand ? Math.random() * innerHeight : innerHeight + 6,
    r:  Math.random() * 1.4 + 0.2,
    vx: (Math.random() - 0.5) * 0.32,
    vy: -(Math.random() * 0.42 + 0.1),
    a:  alpha,
    h:  hues[Math.floor(Math.random() * hues.length)],
    ph: Math.random() * 1000
  };
}

function rafParticles() {
  const dark = document.documentElement.dataset.theme === 'dark';
  const pSat = dark ? '52%' : '60%';
  const pLit = dark ? '86%' : '58%';
  pctx.clearRect(0, 0, innerWidth, innerHeight);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    p.x += p.vx + Math.sin(p.y * 0.011 + p.ph) * 0.11;
    p.y += p.vy;
    if (p.y < -8) { parts[i] = mkPart(false); continue; }
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.r, 0, 6.2832);
    pctx.fillStyle = 'hsla(' + p.h + ',' + pSat + ',' + pLit + ',' + p.a + ')';
    pctx.fill();
  }
  requestAnimationFrame(rafParticles);
}

buildParticles();
parts = Array.from({ length: PCNT }, () => mkPart(true));
requestAnimationFrame(rafParticles);

let partResizeTimer;
addEventListener('resize', () => {
  clearTimeout(partResizeTimer);
  partResizeTimer = setTimeout(buildParticles, 150);
});

// ══════════════════════════════════════════════════════ LIVE SENSOR DATA + GEOLOCATION
// Sources: Open-Meteo Weather API + Open-Meteo Air Quality API (free, no API key, CORS-enabled).
// Location: uses browser Geolocation API when granted; falls back to Dhaka.
(function () {
  const DEFAULT_LAT  = 23.8103;
  const DEFAULT_LON  = 90.4125;
  const DEFAULT_CITY = 'Dhaka';
  const REFRESH_MS   = 10 * 60 * 1000; // refresh every 10 minutes

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setText(id, txt) {
    const el = document.getElementById(id);
    if (el) el.textContent = txt;
  }
  function setDot(id, cls) {
    const el = document.getElementById(id);
    if (el) el.className = 'si-dot ' + cls;
  }
  function setCity(name) {
    const el = document.querySelector('.si-city');
    if (el) el.textContent = '⬤ ' + name.toUpperCase();
  }

  // CO₂ – no public real-time hyperlocal API; use global baseline + traffic cycle.
  function co2Estimate() {
    const h   = new Date().getHours();
    const off = 4 * Math.sin((h - 8) * Math.PI / 12) - 2 * Math.sin(h * Math.PI / 6);
    return Math.round(424 + off);
  }

  // Wind degrees → 8-point compass
  function degToCompass(deg) {
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    return dirs[Math.round(((deg % 360) / 45)) % 8];
  }

  // AQI thresholds (US EPA 6-level)
  function aqiDot(v)  { return v <= 50  ? 'g' : v <= 100  ? 'y' : v <= 150  ? 'o' : v <= 200 ? 'r' : v <= 300 ? 'p' : 'm'; }
  function pmDot(v)   { return v < 12   ? 'g' : v < 35.4  ? 'y' : v < 55.4  ? 'o' : v < 150.4 ? 'r' : v < 250.4 ? 'p' : 'm'; }
  function no2Dot(v)  { return v < 40   ? 'g' : v < 100   ? 'y' : 'r'; }
  function o3Dot(v)   { return v < 60   ? 'g' : v < 120   ? 'y' : 'r'; }
  function co2Dot(v)  { return v < 450  ? 'g' : v < 700   ? 'y' : 'r'; }

  function setUpdated() {
    const now = new Date();
    setText('s-updated', String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'));
  }

  // ── Local time ticker (browser timezone, no geolocation needed) ───────────
  function updateTime() {
    const now     = new Date();
    const hh      = String(now.getHours()).padStart(2, '0');
    const mm      = String(now.getMinutes()).padStart(2, '0');
    const ss      = String(now.getSeconds()).padStart(2, '0');
    // Extract short timezone abbreviation (e.g. "BST", "UTC+6")
    const tzParts = now.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ');
    const tzAbbr  = tzParts[tzParts.length - 1] || '';
    setText('s-time', hh + ':' + mm + ':' + ss + (tzAbbr ? ' ' + tzAbbr : ''));
  }
  setInterval(updateTime, 1000);
  updateTime();

  // ── Build API URLs for any lat/lon ────────────────────────────────────────
  function buildWeatherURL(lat, lon) {
    return 'https://api.open-meteo.com/v1/forecast'
      + '?latitude='  + lat + '&longitude=' + lon
      + '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m'
      + '&wind_speed_unit=kmh&timezone=auto';
  }
  function buildAqiURL(lat, lon) {
    return 'https://air-quality-api.open-meteo.com/v1/air-quality'
      + '?latitude=' + lat + '&longitude=' + lon
      + '&current=pm2_5,nitrogen_dioxide,ozone,us_aqi&timezone=auto';
  }

  // ── Reverse-geocode via Nominatim (one request on page load) ──────────────
  function reverseGeocode(lat, lon) {
    return fetch(
      'https://nominatim.openstreetmap.org/reverse?lat=' + lat.toFixed(4)
      + '&lon=' + lon.toFixed(4) + '&format=json&zoom=10',
      { headers: { 'Accept-Language': 'en' } }
    )
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      if (!d || !d.address) return DEFAULT_CITY;
      return d.address.city || d.address.town || d.address.county || d.address.state || DEFAULT_CITY;
    })
    .catch(function () { return DEFAULT_CITY; });
  }

  // ── Fetch weather + AQI for given coordinates ─────────────────────────────
  async function fetchData(lat, lon) {
    // Weather and AQI are fetched independently so a failure in one does not
    // prevent the other from showing data.

    // Weather
    try {
      const wRes = await fetch(buildWeatherURL(lat, lon));
      if (wRes.ok) {
        const w  = await wRes.json();
        const cw = w.current || {};
        const temp = cw.temperature_2m;
        const hum  = cw.relative_humidity_2m;
        const wspd = cw.wind_speed_10m;
        const wdir = cw.wind_direction_10m;
        if (temp != null) setText('s-temp', temp.toFixed(1) + ' °C');
        if (hum  != null) setText('s-hum',  Math.round(hum) + ' %');
        if (wspd != null && wdir != null)
          setText('s-wind', Math.round(wspd) + ' km/h ' + degToCompass(wdir));
      }
    } catch (_) {}

    // Air quality
    try {
      const aqRes = await fetch(buildAqiURL(lat, lon));
      if (aqRes.ok) {
        const aq  = await aqRes.json();
        const caq = aq.current || {};
        const aqi = caq.us_aqi;
        const pm  = caq.pm2_5;
        const no2 = caq.nitrogen_dioxide;
        const o3  = caq.ozone;
        if (aqi != null) { setText('s-aqi', Math.round(aqi));             setDot('d-aqi', aqiDot(aqi)); }
        if (pm  != null) { setText('s-pm',  pm.toFixed(1) + ' µg/m³');   setDot('d-pm',  pmDot(pm));   }
        if (no2 != null) { setText('s-no2', no2.toFixed(2) + ' µg/m³');  setDot('d-no2', no2Dot(no2)); }
        if (o3  != null) { setText('s-o3',  o3.toFixed(1)  + ' µg/m³');  setDot('d-o3',  o3Dot(o3));   }
      }
    } catch (_) {}

    // CO₂ (local estimate) and timestamp always update
    const co2 = co2Estimate();
    setText('s-co2', co2 + ' ppm');
    setDot('d-co2', co2Dot(co2));
    setUpdated();
  }

  function startRefresh(lat, lon) {
    fetchData(lat, lon);
    setInterval(function () { fetchData(lat, lon); }, REFRESH_MS);
  }

  // ── Geolocation: try user location, fall back to Dhaka ───────────────────
  const GEO_TIMEOUT_MS = 8000; // must exceed the options.timeout value (7000)
  if (navigator.geolocation) {
    let resolved = false;
    const geoTimer = setTimeout(function () {
      if (!resolved) { resolved = true; startRefresh(DEFAULT_LAT, DEFAULT_LON); }
    }, GEO_TIMEOUT_MS);

    navigator.geolocation.getCurrentPosition(
      function (pos) {
        if (resolved) return;
        resolved = true;
        clearTimeout(geoTimer);
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        // Show coordinates immediately; update to city name once geocoded
        reverseGeocode(lat, lon).then(function (city) { setCity(city); });
        startRefresh(lat, lon);
      },
      function () {
        if (resolved) return;
        resolved = true;
        clearTimeout(geoTimer);
        startRefresh(DEFAULT_LAT, DEFAULT_LON);
      },
      { timeout: 7000, maximumAge: 300000 }
    );
  } else {
    startRefresh(DEFAULT_LAT, DEFAULT_LON);
  }
}());

// ══════════════════════════════════════════════════════ AIRSHIP PHYSICS
(function () {
  const wrap    = document.getElementById('airship-wrap');
  const flagDir = document.getElementById('flag-dir');
  if (!wrap || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const airSvg = document.getElementById('airship-svg');
  const DEFAULT_AW = 110; // fallback when element hasn't rendered yet
  function getAW() { return (airSvg && airSvg.offsetWidth > 0) ? airSvg.offsetWidth : DEFAULT_AW; }

  let phase        = 'idle';
  let startTs      = 0;
  let lastFlagFlip = false; // tracks whether flag is currently rotated right/neutral

  // Hanging banner swing: rotate slightly backward (opposite travel direction).
  // Uses CSS style.transform so the CSS transition handles the smooth tween.
  function setFlagDir(flip) {
    if (!flagDir || flip === lastFlagFlip) return;
    lastFlagFlip = flip;
    // Moving right → banner trails left (−7°); stationary/left → hangs straight
    flagDir.style.transform = flip ? 'rotate(-7deg)' : 'rotate(0deg)';
  }

  function raf(ts) {
    if (startTs === 0) startTs = ts;
    const elapsed = ts - startTs;
    const AW = getAW();

    if (phase === 'fly-in') {
      const DUR = 5500;
      const t   = Math.min(elapsed / DUR, 1.0);
      const e   = 1 - Math.pow(1 - t, 3); // cubic ease-out

      const sx  = -(AW + 40);
      const ex  = window.innerWidth  * 0.50 - AW * 0.5; // centered horizontally
      const by  = window.innerHeight * 0.70;             // below "Coming Soon"
      const cx  = sx + (ex - sx) * e;
      const cy  = by - Math.sin(t * Math.PI) * 28;      // gentle arc upward then settles
      const tilt = (1 - e) * -4;                        // nose-up during fly-in

      wrap.style.transform = 'translate(' + cx + 'px,' + cy + 'px) rotate(' + tilt + 'deg)';
      // Flying right during fly-in → flag streams left
      setFlagDir(true);

      if (t >= 1.0) {
        phase   = 'float';
        startTs = 0; // reset for float timer
      }

    } else if (phase === 'float') {
      const s  = elapsed * 0.001;
      // Home position re-computed each frame so resize is handled
      const hx = window.innerWidth  * 0.50 - AW * 0.5;
      const hy = window.innerHeight * 0.70;
      // Multi-frequency drift gives organic, physics-like floating
      const x  = hx + Math.sin(s * 0.18) * 72 + Math.sin(s * 0.11) * 28 + Math.sin(s * 0.31) * 12;
      const y  = hy + Math.sin(s * 0.26) * 20 + Math.sin(s * 0.15) * 9;
      // Tilt proportional to instantaneous velocity vector (pitch = atan2(vy, vx) blended in)
      const dt = 0.016;
      const px = hx + Math.sin((s - dt) * 0.18) * 72 + Math.sin((s - dt) * 0.11) * 28 + Math.sin((s - dt) * 0.31) * 12;
      const py = hy + Math.sin((s - dt) * 0.26) * 20 + Math.sin((s - dt) * 0.15) * 9;
      const vx = (x - px) / dt;
      const vy = (y - py) / dt;
      // Blend horizontal and vertical velocity for a realistic envelope pitch
      const tilt = Math.max(-10, Math.min(10, vx * 0.036 + vy * 0.014));

      wrap.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + tilt + 'deg)';

      // Flag physics: streams opposite to direction of travel (> 1.5 px/s threshold to avoid flicker)
      setFlagDir(vx > 1.5);
    }

    requestAnimationFrame(raf);
  }

  // Start fly-in exactly when 'Coming Soon' text fades in (~2.2 s)
  setTimeout(function () {
    phase   = 'fly-in';
    startTs = 0;
    requestAnimationFrame(raf);
  }, 2200);
}());

// ══════════════════════════════════════════════════════ CABLE SWAY
(function () {
  // Each wire defined by: [id, x0,y0, cx1,cy1, cx2,cy2, x1,y1]
  // Sway is a small perpendicular (vertical) sinusoidal offset applied to
  // both Bezier control points, giving a realistic wind-blown catenary.
  var wires = [
    { id:'wire-l-gnd', x0:370,y0:130, cx1:410,cy1:147, cx2:450,cy2:154, x1:490,y1:151, amp:0.9, freq:0.55, ph:0.0 },
    { id:'wire-l-lft', x0:358,y0:134, cx1:398,cy1:152, cx2:438,cy2:159, x1:478,y1:155, amp:1.2, freq:0.48, ph:0.8 },
    { id:'wire-l-rgt', x0:382,y0:134, cx1:422,cy1:152, cx2:462,cy2:159, x1:502,y1:155, amp:1.2, freq:0.52, ph:1.5 },
    { id:'wire-r-gnd', x0:1000,y0:103,cx1:1023,cy1:117,cx2:1047,cy2:121,x1:1070,y1:114,amp:0.8, freq:0.60, ph:0.3 },
    { id:'wire-r-lft', x0:988, y0:107,cx1:1011,cy1:121,cx2:1035,cy2:125,x1:1058,y1:118,amp:1.1, freq:0.45, ph:1.1 },
    { id:'wire-r-rgt', x0:1012,y0:107,cx1:1035,cy1:121,cx2:1059,cy2:125,x1:1082,y1:118,amp:1.1, freq:0.50, ph:2.0 },
    { id:'wire-l0l1-gnd', x0:190,y0:94,  cx1:247,cy1:122, cx2:313,cy2:130, x1:370,y1:128, amp:1.0, freq:0.42, ph:0.4 },
    { id:'wire-l0l1-lft', x0:178,y0:98,  cx1:238,cy1:127, cx2:308,cy2:136, x1:358,y1:134, amp:1.3, freq:0.38, ph:1.2 },
    { id:'wire-l0l1-rgt', x0:202,y0:98,  cx1:262,cy1:127, cx2:332,cy2:136, x1:382,y1:134, amp:1.3, freq:0.44, ph:2.1 },
    { id:'wire-l2m1-gnd', x0:490,y0:149, cx1:527,cy1:148, cx2:563,cy2:140, x1:600,y1:130, amp:0.9, freq:0.50, ph:0.7 },
    { id:'wire-m1m2-gnd', x0:600,y0:132, cx1:638,cy1:120, cx2:682,cy2:105, x1:730,y1:92,  amp:1.0, freq:0.46, ph:1.5 },
    { id:'wire-m2r1-gnd', x0:730,y0:92,  cx1:820,cy1:122, cx2:910,cy2:122, x1:1000,y1:103,amp:2.2, freq:0.32, ph:0.6 },
    { id:'wire-r2r3-gnd', x0:1070,y0:114,cx1:1107,cy1:121,cx2:1143,cy2:120,x1:1180,y1:114,amp:0.8,freq:0.55,ph:1.8 }
  ];
  // Pre-cache elements
  wires.forEach(function(w){ w.el = document.getElementById(w.id); });
  if (!wires[0].el) return; // scene SVG not in DOM
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  function animWires(ts) {
    var t = ts * 0.001;
    wires.forEach(function(w) {
      if (!w.el) return;
      // Blend two sine waves per wire for irregular "gusting" motion
      var s = w.amp * (Math.sin(t * w.freq + w.ph) * 0.7 + Math.sin(t * w.freq * 1.62 + w.ph) * 0.3);
      var d = 'M' + w.x0 + ',' + w.y0
            + ' C' + w.cx1 + ',' + (w.cy1 + s)
            + ' '  + w.cx2 + ',' + (w.cy2 + s)
            + ' '  + w.x1  + ',' + w.y1;
      w.el.setAttribute('d', d);
    });
    requestAnimationFrame(animWires);
  }
  requestAnimationFrame(animWires);
}());

</script>
